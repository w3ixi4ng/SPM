server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # React Router owns every path below the root, and none of them exist on
  # disk. Without this fallback, opening /dashboard/event-organiser directly --
  # or just reloading it -- asks nginx for a file that was never built and gets
  # a 404 instead of the app. Deep links and refreshes are exactly what the
  # e2e tests do, so this line is what makes them pass.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Vite content-hashes everything under /assets, so a filename never changes
  # meaning and can be cached hard.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # index.html must not be cached, or a browser keeps booting the previous
  # deploy's bundle by name after a rebuild.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
