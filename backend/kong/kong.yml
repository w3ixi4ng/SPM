# Kong's routing table, in DB-less mode: this file IS the configuration. There
# is no database and no admin API, so a change here means restarting Kong, and
# the gateway's behaviour is reviewable in a diff like everything else.
#
# One rule per service. The frontend knows `/api` and nothing else -- not a
# port, not a service name, not how many services there are.

_format_version: "3.0"

services:
  - name: users
    # The path matters. Kong strips the matched route prefix and appends what
    # is left to this URL, so:
    #
    #   /api/users/signup  ->  strip /api/users  ->  /signup
    #                      ->  http://users:8001/users + /signup
    #                      ->  http://users:8001/users/signup
    #
    # which is the route the service actually serves. Drop the /users here and
    # every request arrives one path segment short.
    url: http://users:8001/users
    routes:
      - name: users
        paths:
          - /api/users
        strip_path: true

  - name: events
    # Keep /events on the upstream URL. Kong strips /api/events, then appends
    # the remaining path, so /api/events/{id} reaches /events/{id}.
    url: http://events:8002/events
    routes:
      - name: events
        paths:
          - /api/events
        strip_path: true

  - name: venues
    # Keep /venues on the upstream URL, as for events: /api/venues/{id}
    # reaches /venues/{id}.
    url: http://venues:8003/venues
    routes:
      - name: venues
        paths:
          - /api/venues
        strip_path: true

  - name: equipment
    # Catalogue management and selection both live under /equipment.
    url: http://equipment:8005/equipment
    routes:
      - name: equipment
        paths:
          - /api/equipment
        strip_path: true

  - name: notifications
    # Only the authenticated inbox is browser-facing. Internal batch creation
    # lives at /internal/notifications and does not match this route.
    url: http://notifications:8006/notifications
    routes:
      - name: notifications
        paths:
          - /api/notifications
        strip_path: true

  - name: event-requests
    # Same pattern as events: keep /event-requests on the upstream URL so
    # /api/event-requests/{id}/submit reaches /event-requests/{id}/submit.
    # Fronts submission, editing, the Lead's unassigned queue, and explicit
    # assignment; draft create/read/list stay on /api/events.
    url: http://event_requests:8100/event-requests
    routes:
      - name: event-requests
        paths:
          - /api/event-requests
        strip_path: true

  - name: venue-bookings
    # Keep /venue-bookings on the upstream URL, as for the others:
    # /api/venue-bookings/pending reaches /venue-bookings/pending. The
    # bookings atomic service behind it has no route here -- only this
    # composite calls it.
    url: http://venue_bookings:8101/venue-bookings
    routes:
      - name: venue-bookings
        paths:
          - /api/venue-bookings
        strip_path: true

  - name: equipment-requirements
    # The browser reaches only this orchestration route. Its equipment atomic
    # routes are intentionally internal so assignment/status checks cannot be
    # bypassed through Kong.
    url: http://equipment_requirements:8102/equipment-requirements
    routes:
      - name: equipment-requirements
        paths:
          - /api/equipment-requirements
        strip_path: true

  - name: safety-checks
    # Safety Officers use one composite route; the event, booking, venue,
    # equipment and user atomic reads behind it remain internal.
    url: http://safety_checks:8103/safety-checks
    routes:
      - name: safety-checks
        paths:
          - /api/safety-checks
        strip_path: true

  - name: event-registrations
    # S-51: confirmed events' public pages and Attendee registration. The
    # registrations atomic service behind it has no route here.
    url: http://event_registrations:8104/event-registrations
    routes:
      - name: event-registrations
        paths:
          - /api/event-registrations
        strip_path: true

  # The frontend, last and least specific. Kong matches the longest path
  # prefix first, so the `/api/...` routes above still win over `/` and
  # this only catches what they did not.
  #
  # strip_path is false because the SPA needs its own path: React Router reads
  # /dashboard/event-organiser from the URL, and nginx needs it to serve
  # index.html. Stripping it would deliver every deep link as `/`.
  #
  # This is what makes the session cookies work without CORS -- the app and
  # the services are one origin here, which is the arrangement
  # frontend/vite.config.js proxies to imitate in development.
  - name: frontend
    url: http://frontend:80
    routes:
      - name: frontend
        paths:
          - /
        strip_path: false
