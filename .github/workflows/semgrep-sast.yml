name: SAST Scan with Semgrep

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest

    # Official image — has semgrep and its rules preinstalled.
    container:
      image: semgrep/semgrep

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/python \
            --config p/javascript \
            --config p/react \
            --config p/secrets \
            --config p/security-audit \
            --sarif --output semgrep.sarif \
            --metrics off \
            --error
        # --error fails the job when anything is found. Drop it to make the
        # scan advisory instead of blocking.

      - name: Upload SARIF report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sarif
          path: semgrep.sarif

      - name: Upload to GitHub code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
