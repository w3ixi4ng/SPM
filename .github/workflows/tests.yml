name: Tests

on:
  # main, and each sprint's release branch (sprint3, sprint4, ...): story
  # branches merge into the sprint branch, which merges into main at the end.
  # fix is a release branch for fixes outside a sprint, checked the same way.
  pull_request:
    branches: [main, 'sprint*', fix]
  push:
    branches: [main, 'sprint*', fix]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------
  # Fast, isolated, no setup. Supabase is a MagicMock, so nothing here
  # needs a secret, a container, or a network.
  # ---------------------------------------------------------------------
  unit:
    name: Unit (pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The service code is imported directly, so its own dependencies have to
      # be here too -- that is what tests/requirements.txt collects. The
      # per-service conftests put the service folder on sys.path and stub the
      # Supabase environment variables themselves, so there is nothing else to
      # set up.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements.txt

      # One worker per CPU on the runner; see --workers in tests/conftest.py.
      - name: Run unit tests
        run: pytest tests/unit -v --workers auto

  # ---------------------------------------------------------------------
  # The frontend's policy mirror and API contract, checked without a browser.
  # These import frontend/src/lib/*.js directly and use only node:test and
  # node:assert, so there is no install step and no node_modules.
  # ---------------------------------------------------------------------
  frontend_unit:
    name: Unit (node)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run frontend unit tests
        run: node --test tests/unit/frontend/test_*.mjs

  # ---------------------------------------------------------------------
  # Integration, then end-to-end, against the real TEST Supabase project --
  # both in supabase-suites.yml, which says why they are a workflow of their
  # own.
  #
  # Both write to the one test project, so across all runs -- every PR and
  # every branch -- only one run of them uses it at a time; the rest wait.
  # GitHub keeps one waiting per group: if a third arrives, the older waiting
  # one is cancelled and needs "Re-run jobs".
  #
  # Skipped on pull requests from forks: those get no secrets, and a job that
  # cannot authenticate would fail for a reason the contributor cannot fix.
  # ---------------------------------------------------------------------
  supabase:
    name: Supabase
    concurrency:
      group: supabase-test-project
      cancel-in-progress: false
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/supabase-suites.yml
    secrets: inherit
