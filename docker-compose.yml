# Values come from .env (your project) or .env.test (the throwaway one):
#
#   docker compose up --build
#   docker compose --env-file .env.test up -d --build --wait
#
# Inside this network a service is reached by its compose service name and its
# own port -- http://users:8001. `localhost` inside a container means that
# container, which is why USERS_SERVICE_URL defaults to the name form.

# Pinned, rather than derived from the directory name, so a checkout in a
# differently-named folder still builds spm-users and spm_default.
name: spm

services:

# The front door. The browser calls Kong and nothing else, so adding a
# service later costs the frontend no change -- only a rule in kong.yml.
  kong:
    image: kong:3.7
    ports:
      - "${KONG_PROXY_PORT}:8000"
    environment:
      # DB-less: the routing table is backend/kong/kong.yml, not a database.
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      # No admin API. DB-less does not need one, and Kong's default admin port
      # is 8001 -- which the users service already owns.
      KONG_ADMIN_LISTEN: "off"
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
    volumes:
      - ./backend/kong:/kong:ro
    depends_on:
      users:
        condition: service_healthy
      events:
        condition: service_healthy
      venues:
        condition: service_healthy
      equipment:
        condition: service_healthy
      notifications:
        condition: service_healthy
      event_requests:
        condition: service_healthy
      venue_bookings:
        condition: service_healthy
      equipment_requirements:
        condition: service_healthy
      safety_checks:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
# The built React bundle, served by nginx behind Kong.
#
# Deliberately NOT published on a host port. The app calls a relative `/api`,
# which only resolves when something serves the app and the services on one
# origin -- that is Kong, on ${KONG_PROXY_PORT}. Reaching this container
# directly would load the page and 404 every API call, which looks like a
# broken backend. For day-to-day frontend work run `npm run dev` instead; its
# Vite proxy forwards /api to Kong and gives you hot reload.
  frontend:
    build: ./frontend
    healthcheck:
      # busybox wget -- the nginx alpine image has no curl. 127.0.0.1, not
      # localhost: `listen 80` binds IPv4 only, localhost resolves to ::1
      # first, and busybox wget does not fall back the way Python's urllib
      # does in the other services' checks. It just reports "connection
      # refused" from a container that is serving pages perfectly well.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
  users:
    build: ./backend/services/atomic/users
    ports:
      - "${USERS_SERVICE_PORT}:8001"
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
    healthcheck:
      # python, not curl: the slim image has no curl, and adding one just for
      # a health check is a package to keep patched for no reason.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/health').read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
  events:
    build: ./backend/services/atomic/events
    ports:
      - "${EVENTS_SERVICE_PORT}:8002"
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8002/health').read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
  venues:
    build: ./backend/services/atomic/venues
    ports:
      - "${VENUES_SERVICE_PORT}:8003"
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8003/health').read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
  event_requests:
    build: ./backend/services/composite/event_requests
    ports:
      - "${EVENT_REQUESTS_SERVICE_PORT}:8100"
    environment:
      USERS_SERVICE_URL: ${USERS_SERVICE_URL}
      EVENTS_SERVICE_URL: ${EVENTS_SERVICE_URL}
      NOTIFICATIONS_SERVICE_URL: ${NOTIFICATIONS_SERVICE_URL:-http://notifications:8006}
    depends_on:
      users:
        condition: service_healthy
      events:
        condition: service_healthy
      notifications:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8100/health').read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
  bookings:
    build: ./backend/services/atomic/bookings
    ports:
      - "${BOOKINGS_SERVICE_PORT}:8004"
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8004/health').read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
  equipment:
    build: ./backend/services/atomic/equipment
    ports:
      - "${EQUIPMENT_SERVICE_PORT}:8005"
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8005/health').read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
  notifications:
    build: ./backend/services/atomic/notifications
    ports:
      - "${NOTIFICATIONS_SERVICE_PORT:-8006}:8006"
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8006/health').read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
  # Checks a Coordinator's venue request against the event and the venue,
  # then writes it through bookings; serves Venue Staff's pending list.
  venue_bookings:
    build: ./backend/services/composite/venue_bookings
    ports:
      - "${VENUE_BOOKINGS_SERVICE_PORT}:8101"
    environment:
      USERS_SERVICE_URL: ${USERS_SERVICE_URL}
      EVENTS_SERVICE_URL: ${EVENTS_SERVICE_URL}
      VENUES_SERVICE_URL: ${VENUES_SERVICE_URL}
      BOOKINGS_SERVICE_URL: ${BOOKINGS_SERVICE_URL}
      NOTIFICATIONS_SERVICE_URL: ${NOTIFICATIONS_SERVICE_URL:-http://notifications:8006}
    depends_on:
      users:
        condition: service_healthy
      events:
        condition: service_healthy
      venues:
        condition: service_healthy
      bookings:
        condition: service_healthy
      notifications:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8101/health').read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
  # Lets the currently assigned Coordinator edit event equipment requirements
  # during planning and Technical Support read them. Storage stays in the
  # equipment atomic service.
  equipment_requirements:
    build: ./backend/services/composite/equipment_requirements
    ports:
      - "${EQUIPMENT_REQUIREMENTS_SERVICE_PORT:-8102}:8102"
    environment:
      USERS_SERVICE_URL: ${USERS_SERVICE_URL}
      EVENTS_SERVICE_URL: ${EVENTS_SERVICE_URL}
      EQUIPMENT_SERVICE_URL: ${EQUIPMENT_SERVICE_URL:-http://equipment:8005}
    depends_on:
      users:
        condition: service_healthy
      events:
        condition: service_healthy
      equipment:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8102/health').read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
  # Authenticates Safety Officers and combines event, organiser, confirmed
  # venue, technical-support and equipment data without owning storage.
  safety_checks:
    build: ./backend/services/composite/safety_checks
    ports:
      - "${SAFETY_CHECKS_SERVICE_PORT:-8103}:8103"
    environment:
      USERS_SERVICE_URL: ${USERS_SERVICE_URL}
      EVENTS_SERVICE_URL: ${EVENTS_SERVICE_URL}
      VENUES_SERVICE_URL: ${VENUES_SERVICE_URL}
      BOOKINGS_SERVICE_URL: ${BOOKINGS_SERVICE_URL}
      EQUIPMENT_SERVICE_URL: ${EQUIPMENT_SERVICE_URL:-http://equipment:8005}
    depends_on:
      users:
        condition: service_healthy
      events:
        condition: service_healthy
      venues:
        condition: service_healthy
      bookings:
        condition: service_healthy
      equipment:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8103/health').read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
